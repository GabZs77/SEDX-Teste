name: Build SEDX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'official-app/**'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.svg'
      - 'EM/**'
      - 'EF/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: official-app/package-lock.json

      - name: Install Capacitor dependencies and bundle the full SEDX
        working-directory: official-app
        run: |
          npm ci
          npm run sync-site
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: official-app/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose official-app/android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging official-app/android/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedx-apk
          path: official-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
